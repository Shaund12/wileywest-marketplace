# BlockDust — upstream connection pooling for the Express backend.
#
# Install to /etc/nginx/conf.d/blockdust-upstream.conf, then update the
# marketplace server block to proxy_pass http://blockdust_backend; instead of
# http://127.0.0.1:8787; (see ops/nginx-site.patch.md).
#
# Without keepalive, nginx opens and tears down a fresh TCP connection to the
# backend for every proxied request. At marketplace traffic levels — many
# small /api/db and /api/rpc calls per page view — that handshake overhead and
# the resulting TIME_WAIT churn are pure waste.

upstream blockdust_backend {
    server 127.0.0.1:8787;

    # Idle connections kept open per worker process.
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# Cap concurrent connections per IP. limit_req (already configured in
# blockdust-cache.conf) bounds request RATE; this bounds simultaneous
# connections, which is what a slow-loris style client abuses.
limit_conn_zone $binary_remote_addr zone=blockdust_conn_per_ip:10m;
