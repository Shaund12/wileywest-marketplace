# BlockDust PostgreSQL tuning
# Target host: 24 cores / 62 GB RAM / NVMe, PostgreSQL 16.
#
# Install to /etc/postgresql/16/main/conf.d/10-blockdust-tuning.conf
# (that directory is already pulled in by `include_dir = 'conf.d'`).
# Requires a restart: sudo systemctl restart postgresql
#
# NOTE: this Postgres server is shared with sibling projects; these are
# server-wide settings, not per-database. Sizing below deliberately leaves
# ample headroom rather than claiming the whole box.

# --- Memory ---------------------------------------------------------------
# Default was 128MB. 8GB is ~13% of RAM: a large improvement while leaving
# room for the other services on this machine (hyved, IPFS, dev servers).
shared_buffers = 8GB

# Planner hint for how much RAM is available for caching overall (OS cache
# included). Not an allocation. Default 4GB badly understates this host.
effective_cache_size = 24GB

# Per sort/hash node, not per connection. The pool caps at 10 connections
# (backend/db/pgClient.js), so worst-case concurrent usage stays bounded.
work_mem = 32MB

# For VACUUM, CREATE INDEX, ALTER TABLE. Only a few run at once.
maintenance_work_mem = 2GB

# --- Storage ---------------------------------------------------------------
# The default 4.0 assumes seek-bound spinning disks and pushes the planner
# toward sequential scans. This host is NVMe, where random reads are nearly
# as cheap as sequential — 1.1 lets the 19 indexes in db/schema.sql actually
# get used.
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Write-ahead log -------------------------------------------------------
# Spread checkpoint I/O out instead of spiking at the end of each interval.
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 1GB
wal_buffers = 16MB

# --- Parallelism -----------------------------------------------------------
# 24 cores available; keep per-query parallelism modest since the workload is
# many small API queries rather than few large analytical ones.
max_worker_processes = 24
max_parallel_workers = 12
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# --- Planner statistics ----------------------------------------------------
default_statistics_target = 100

# --- Connections -----------------------------------------------------------
# The app pool uses max: 10. 100 leaves generous room for psql, sibling
# projects, and maintenance without over-allocating per-connection memory.
max_connections = 100

# --- Observability ---------------------------------------------------------
# Surface slow queries without logging normal traffic.
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
