# BlockDust NFT Marketplace — Vite SPA plus the local PostgreSQL API.
server {
    server_name blockdust.pyvendr.com;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    include /etc/nginx/snippets/block-dotfiles.conf;
    include /etc/nginx/snippets/drop-exploit-spray.conf;

    root /var/www/blockdust;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    limit_req_status 429;
    limit_conn_status 429;
    # Concurrent connections per IP (rate is capped separately by limit_req).
    limit_conn blockdust_conn_per_ip 24;
    # No endpoint here accepts a large upload; cap the body rather than
    # letting the default 1m through to the Node process.
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    location /api/ipfs/ {
        limit_req zone=blockdust_media_per_ip burst=30 nodelay;
        proxy_cache blockdust_ipfs;
        proxy_cache_key "$scheme$proxy_host$uri";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 15s;
        proxy_cache_valid 200 365d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-BlockDust-Media-Cache $upstream_cache_status always;
        proxy_pass http://blockdust_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/media/ {
        limit_req zone=blockdust_media_per_ip burst=30 nodelay;
        proxy_cache blockdust_ipfs;
        proxy_cache_key "$scheme$proxy_host$uri";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 15s;
        proxy_cache_valid 200 365d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-BlockDust-Media-Cache $upstream_cache_status always;
        proxy_pass http://blockdust_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/rpc/ {
        limit_req zone=blockdust_rpc_per_ip burst=15 nodelay;
        proxy_pass http://blockdust_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /api/sync-user-collections {
        limit_req zone=blockdust_sync_per_ip burst=3 nodelay;
        proxy_pass http://blockdust_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/db/ {
        limit_req zone=blockdust_db_per_ip burst=15 nodelay;
        proxy_pass http://blockdust_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=blockdust_api_per_ip burst=30 nodelay;
        proxy_pass http://blockdust_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/blockdust.pyvendr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blockdust.pyvendr.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = blockdust.pyvendr.com) { return 301 https://$host$request_uri; }
    listen 80;
    listen [::]:80;
    server_name blockdust.pyvendr.com;
    return 404;
}
